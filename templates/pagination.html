{% if page.has_other_pages %}<nav class="pagination" aria-label="Strony">{% if page.has_previous %}<a class="button secondary" href="?page={{ page.previous_page_number }}{% if request.GET.mine %}&mine=1{% endif %}">← Poprzednia</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button secondary" href="?page={{ page.next_page_number }}{% if request.GET.mine %}&mine=1{% endif %}">Następna →</a>{% endif %}</nav>{% endif %}

<article class="card task-card"><div class="metadata"><span class="pill {% if assignment.status == 'COMPLETED' %}success{% endif %}">{{ assignment.get_status_display }}</span></div><h3>{{ assignment.task.description }}</h3>{% if assignment.status == 'COMPLETED' %}<a href="{% url 'photo' assignment.photo.id %}"><img loading="lazy" src="{% url 'thumbnail' assignment.photo.id %}" alt="Twoje zdjęcie do zadania: {{ assignment.task.description }}"></a>{% endif %}{% if playable %}<form class="busy-form upload-form" method="post" action="{% url 'upload' assignment.id %}" enctype="multipart/form-data">{% csrf_token %}<input type="hidden" name="idempotency_key" value="{{ assignment.upload_key }}"><input type="hidden" name="expected_version" value="{{ assignment.version }}"><label for="file-{{ assignment.id }}">{% if assignment.version %}Nowe zdjęcie{% else %}Twoje zdjęcie{% endif %}</label><input id="file-{{ assignment.id }}" type="file" name="photo" accept="image/jpeg,image/png,image/webp" required><p class="small muted">JPEG, PNG lub WebP · do 15 MiB</p>{% if assignment.version %}<label class="check"><input type="checkbox" required> Rozumiem, że podmiana usunie oceny i komentarze poprzedniego zdjęcia.</label>{% endif %}<button class="button secondary full">{% if assignment.version %}Podmień zdjęcie{% else %}Wyślij zdjęcie ↗{% endif %}</button><span class="busy-message" aria-live="polite"></span></form>{% endif %}</article>

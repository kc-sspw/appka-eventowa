services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["private:/app/.private"]
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --error-logfile -"]
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000); c.request('GET','/admin/login/',headers={'Host':'platform.localhost'}); assert c.getresponse().status==200"]
      interval: 5s
      retries: 20
  worker:
    build: .
    env_file: .env
    volumes: ["private:/app/.private"]
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "storage_worker"]
volumes:
  database:
  private:
